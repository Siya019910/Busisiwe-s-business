<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Contact - It's Drushy with them Lashes...</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;1,300&family=Raleway:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Raleway', Arial, sans-serif;
      margin: 0; padding: 0;
      background: url('footer.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      width: 100%;
    }

    /* ── HEADER ── */
    header {
      background: rgba(255, 218, 185, 0.88);
      padding: 8px 12px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
    }
    .header-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 560px;
      margin: 0 auto;
    }
    .header-logo {
      width: 46px; height: 46px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid goldenrod;
      box-shadow: 0 0 8px rgba(218,165,32,0.5);
    }
    .header-text { flex: 1; text-align: right; overflow: hidden; }
    .brand-name {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1rem, 5vw, 1.3rem);
      color: goldenrod;
      display: block;
      direction: rtl;
      line-height: 1.2;
      white-space: nowrap;
    }
    .brand-tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(0.62rem, 3vw, 0.82rem);
      color: goldenrod;
      display: block;
      text-align: right;
      opacity: 0.85;
      letter-spacing: 0.06em;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
      padding: 6px 4px 5px;
      max-width: 560px;
      margin: 0 auto;
    }
    nav a {
      font-family: 'Raleway', sans-serif;
      font-weight: 600;
      font-size: clamp(0.6rem, 3vw, 0.76rem);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-decoration: none;
      color: goldenrod;
      background: rgba(255, 215, 0, 0.18);
      border: 1.5px solid transparent;
      padding: 5px 10px;
      border-radius: 20px;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    nav a:hover, nav a.active {
      background: goldenrod;
      color: #fff;
      border-color: goldenrod;
      box-shadow: 0 0 8px rgba(218,165,32,0.5);
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      padding: 22px 16px;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
    }

    /* ── CONTACT INFO ── */
    .contact-info {
      text-align: center;
      margin: 0 0 22px;
      padding: 20px 20px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      color: #000;
      line-height: 1.8;
      font-size: clamp(0.95rem, 3.8vw, 1.05rem);
    }

    /* ── BUTTONS ── */
    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 11px;
      margin: 0 auto;
      width: 100%;
      max-width: 300px;
    }
    .buttons a {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      color: goldenrod;
      background: rgba(255, 215, 0, 0.2);
      border: 2px solid goldenrod;
      padding: 12px 25px;
      border-radius: 25px;
      font-family: 'Raleway', sans-serif;
      font-weight: 600;
      font-size: 0.92rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: background 0.3s, color 0.3s, transform 0.2s;
    }
    .buttons a:hover {
      background: goldenrod;
      color: #fff;
      transform: scale(1.04);
    }

    /* ── FOOTER ── */
    footer {
      background: rgba(255, 218, 185, 0.88);
      text-align: center;
      padding: 7px 12px;
      flex-shrink: 0;
    }
    footer .signature {
      font-family: 'Dancing Script', 'Brush Script MT', cursive;
      font-size: clamp(0.85rem, 3.5vw, 1rem);
      color: goldenrod;
      display: inline-block;
    }

    @media (max-width: 360px) {
      nav a { font-size: 0.58rem; padding: 4px 7px; }
      .brand-name { font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <img src="logo.jpg" alt="Drushy Logo" class="header-logo"/>
      <div class="header-text">
        <span class="brand-name">...It's Drushy with them Lashes</span>
        <span class="brand-tagline">Lashes speak louder than words</span>
      </div>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="services.html">Services</a>
      <a href="contact.html" class="active">Contact</a>
      <a href="referral.html">Referral</a>
    </nav>
  </header>

  <main>
    <div class="contact-info">
      674 Kgotso Street, Twala Section, Katlehong 1431<br/>
      Contact: +27 72 613 256<br/>
      Email: busiweh01@icloud.com
    </div>

    <div class="buttons">
      <a href="https://wa.me/2772613256?text=Hi%20Drushy%2C%20I'd%20like%20to%20book%20my%20lashes!" target="_blank">WhatsApp</a>
      <a href="mailto:busiweh01@icloud.com">Email Me</a>
    </div>
  </main>

  <footer>
    <span class="signature">© 2025 It's Drushy with them Lashes...™</span>
  </footer>
</body>
</html>
