<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>It's Drushy with them Lashes...</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;1,300&family=Raleway:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Raleway', Arial, sans-serif;
      margin: 0; padding: 0;
      background: url('images/footer.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      width: 100%;
    }

    /* ── HEADER ── */
    header {
      background: rgba(255, 218, 185, 0.88);
      padding: 8px 12px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
    }
    .header-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 560px;
      margin: 0 auto;
    }
    .header-logo {
      width: 46px; height: 46px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid goldenrod;
      box-shadow: 0 0 8px rgba(218,165,32,0.5);
    }
    .header-text { flex: 1; text-align: right; overflow: hidden; }
    .brand-name {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1rem, 5vw, 1.3rem);
      color: goldenrod;
      display: block;
      direction: rtl;
      line-height: 1.2;
      white-space: nowrap;
    }
    .brand-tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(0.62rem, 3vw, 0.82rem);
      color: goldenrod;
      display: block;
      text-align: right;
      opacity: 0.85;
      letter-spacing: 0.06em;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
      padding: 6px 4px 5px;
      max-width: 560px;
      margin: 0 auto;
    }
    nav a {
      font-family: 'Raleway', sans-serif;
      font-weight: 600;
      font-size: clamp(0.6rem, 3vw, 0.76rem);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-decoration: none;
      color: goldenrod;
      background: rgba(255, 215, 0, 0.18);
      border: 1.5px solid transparent;
      padding: 5px 10px;
      border-radius: 20px;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    nav a:hover, nav a.active {
      background: goldenrod;
      color: #fff;
      border-color: goldenrod;
      box-shadow: 0 0 8px rgba(218,165,32,0.5);
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      padding: 18px 14px;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
    }

    /* ── LASH GRID ── */
    .images {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .image-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid rgba(218,165,32,0.3);
      display: block;
    }
    .image-card img:hover { transform: scale(1.04); box-shadow: 0 4px 14px rgba(218,165,32,0.4); }
    .image-card p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(0.6rem, 2.5vw, 0.72rem);
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      margin-top: 5px;
      line-height: 1.3;
    }

    /* ── BUTTONS ── */
    .contact-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 11px;
      margin: 4px auto 0;
      width: 100%;
      max-width: 300px;
    }
    .contact-buttons a {
      display: block;
      width: 100%;
      text-align: center;
      font-family: 'Raleway', sans-serif;
      font-weight: 600;
      font-size: 0.92rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      color: goldenrod;
      background: rgba(255, 215, 0, 0.18);
      border: 1.5px solid goldenrod;
      padding: 12px 20px;
      border-radius: 28px;
      transition: all 0.3s ease;
      box-shadow: 0 2px 10px rgba(218,165,32,0.3);
    }
    .contact-buttons a:hover {
      background: goldenrod;
      color: #fff;
      box-shadow: 0 4px 16px rgba(218,165,32,0.5);
      transform: translateY(-1px);
    }

    /* ── LIGHTBOX ── */
    #lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: 100%; max-height: 85vh;
      border-radius: 12px; object-fit: contain;
    }

    /* ── FOOTER ── */
    footer {
      background: rgba(255, 218, 185, 0.88);
      text-align: center;
      padding: 7px 12px;
      flex-shrink: 0;
    }
    footer .signature {
      font-family: 'Dancing Script', 'Brush Script MT', cursive;
      font-size: clamp(0.85rem, 3.5vw, 1rem);
      color: goldenrod;
      display: inline-block;
    }

    @media (max-width: 360px) {
      nav a { font-size: 0.58rem; padding: 4px 7px; }
      .brand-name { font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <img src="images/logo.jpg" alt="Drushy Logo" class="header-logo"/>
      <div class="header-text">
        <span class="brand-name">...It's Drushy with them Lashes</span>
        <span class="brand-tagline">Lashes speak louder than words</span>
      </div>
    </div>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
      <a href="referral.html">Referral</a>
    </nav>
  </header>

  <main>
    <section class="images">
      <div class="image-card">
        <img src="images/lash1.jpg" alt="Beautiful Cluster Lashes" onclick="openLightbox(this.src)"/>
        <p>Small cluster - enhancing your natural beauty</p>
      </div>
      <div class="image-card">
        <img src="images/lash2.jpg" alt="Medium Lashes" onclick="openLightbox(this.src)"/>
        <p>Medium lashes for a balanced look</p>
      </div>
      <div class="image-card">
        <img src="images/lash3.jpg" alt="Cat-eye Style" onclick="openLightbox(this.src)"/>
        <p>Cat-eye lashes for that fierce look</p>
      </div>
    </section>

    <div class="contact-buttons">
      <a href="https://wa.me/27792613256?text=Hi%20Drushy!%20I%20would%20like%20to%20book%20lashes." target="_blank">WhatsApp</a>
      <a href="mailto:busisiweh01@icloud.com">Email Me</a>
    </div>
  </main>

  <footer>
    <span class="signature">© 2025 It's Drushy with them Lashes...™</span>
  </footer>

  <div id="lightbox" onclick="this.classList.remove('open')">
    <img id="lb-img" src="" alt="Zoomed image"/>
  </div>

  <script>
    function openLightbox(src) {
      document.getElementById('lb-img').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    // original script.js lightbox fallback
    document.querySelectorAll('.image-card img').forEach(img => {
      img.addEventListener('click', () => openLightbox(img.src));
    });
  </script>
</body>
</html>
